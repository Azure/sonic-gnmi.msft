# Azure DevOps YAML Template: SONiC Dependencies Installation
#
# This template contains all the common dependency installation steps shared between
# jobs that require CGO/SONiC dependencies (MemoryLeakJob and IntegrationCIJob).
#
# Usage in pipeline jobs:
#   - template: .azure/templates/install-dependencies.yml
#     parameters:
#       buildBranch: $(BUILD_BRANCH)
#
# Dependencies installed:
#   - libyang3 and libnl packages (from sonic-buildimage.common_libs)
#   - sonic-yang-models wheel (from sonic-buildimage artifacts)
#   - sonic-swss-common libraries
#   - protobuf compiler
#
# Note: Building sonic-mgmt-common and sonic-gnmi is NOT included here.
# Only the IntegrationCIJob needs to build and publish artifacts, so that
# step is defined directly in azure-pipelines.yml to avoid duplicate builds.
#
# This eliminates code duplication and ensures consistent dependency setup
# across all jobs that need SONiC/CGO dependencies.

parameters:
- name: buildBranch
  type: string
  default: $(BUILD_BRANCH)

steps:
# Download libyang3 and libnl debs from sonic-buildimage common_libs
- task: DownloadPipelineArtifact@2
  inputs:
    source: specific
    project: build
    pipeline: Azure.sonic-buildimage.common_libs
    artifact: common-lib
    runVersion: 'latestFromBranch'
    runBranch: 'refs/heads/${{ parameters.buildBranch }}'
    path: $(Build.ArtifactStagingDirectory)/download
    patterns: |
        target/debs/trixie/libyang3_*.deb
        target/debs/trixie/libyang-dev_3*.deb
        target/debs/trixie/libnl-3-200_*.deb
        target/debs/trixie/libnl-genl-3-200_*.deb
        target/debs/trixie/libnl-route-3-200_*.deb
        target/debs/trixie/libnl-nf-3-200_*.deb
  displayName: "Download libyang and libnl debs"

# Download sonic yang models from sonic-buildimage
- task: DownloadPipelineArtifact@2
  inputs:
    source: specific
    project: build
    pipeline: 142
    artifact: sonic-buildimage.vs
    runVersion: 'latestFromBranch'
    runBranch: 'refs/heads/${{ parameters.buildBranch }}'
    patterns: |
        target/python-wheels/trixie/sonic_yang_models*.whl
  displayName: "Download sonic yang models"

# Install pytest, jsonpatch and redis
- script: |
    # PYTEST
    sudo pip3 install -U pytest
    sudo pip3 install -U jsonpatch

    # REDIS
    sudo apt-get update
    sudo apt-get install -y redis-server
    sudo sed -ri 's/^# unixsocket/unixsocket/' /etc/redis/redis.conf
    sudo sed -ri 's/^unixsocketperm .../unixsocketperm 777/' /etc/redis/redis.conf
    sudo sed -ri 's/redis-server.sock/redis.sock/' /etc/redis/redis.conf
    sudo service redis-server start
  displayName: "Install dependency"

# Install libyang3 and libnl (libswsscommon dependencies)
- script: |
    set -ex
    sudo apt-get -y purge libnl-3-dev libnl-route-3-dev || true
    sudo dpkg -i $(find $(Build.ArtifactStagingDirectory)/download -name '*.deb')
  displayName: "Install libyang and libnl debs"

# Install sonic yangs
- script: |
    # SONIC YANGS
    set -ex
    sudo pip3 install ../target/python-wheels/trixie/sonic_yang_models*.whl
  displayName: "Install sonic yangs"

# Download sonic-swss-common
- task: DownloadPipelineArtifact@2
  inputs:
    source: specific
    project: build
    pipeline: Azure.sonic-swss-common
    artifact: sonic-swss-common-trixie
    runVersion: 'latestFromBranch'
    runBranch: 'refs/heads/${{ parameters.buildBranch }}'
  displayName: "Download sonic-swss-common"

# Install libswsscommon packages
- script: |
    set -ex
    # LIBSWSSCOMMON
    sudo dpkg -i libswsscommon_1.0.0_amd64.deb
    sudo dpkg -i libswsscommon-dev_1.0.0_amd64.deb
    sudo dpkg -i python3-swsscommon_1.0.0_amd64.deb
  workingDirectory: $(Pipeline.Workspace)/
  displayName: 'Install libswsscommon package'

# Install protoc
- script: |
    sudo apt-get install -y protobuf-compiler
    protoc --version
  displayName: 'Install protoc'
